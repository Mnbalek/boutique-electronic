[build]
base = "."
command = "node node_modules/.pnpm/esbuild@0.28.2/node_modules/esbuild/bin/esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --packages=bundle --outfile=artifacts/api-server/dist/api.mjs && pnpm --filter @workspace/boutik-benin run build"
publish = "artifacts/boutik-benin/dist/public"
functions = "artifacts/api-server/dist"

[functions]
node_bundler = "esbuild"

[build.environment]
NODE_VERSION = "22"
PNPM_FLAGS = "--shamefully-hoist"
PAYMENT_MODE = "mock"

[dev]
command = "pnpm --filter @workspace/boutik-benin run dev"
targetPort = 5173
port = 8888

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
