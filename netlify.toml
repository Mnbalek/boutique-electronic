[build]
base = "."
command = "pnpm --filter @workspace/boutik-benin run build"
publish = "artifacts/boutik-benin/dist/public"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"
external_node_modules = ["@neondatabase/serverless", "drizzle-orm", "hono", "zod"]

[build.environment]
NODE_VERSION = "22"
PNPM_FLAGS = "--shamefully-hoist"

[dev]
command = "pnpm --filter @workspace/boutik-benin run dev"
targetPort = 5173
port = 8888

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
